worker_processes auto;
error_log /dev/stderr warn;

# /var/run is not writable by the unprivileged nginx user.
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;

  # nginx's stock mime.types has no mapping for .csv, so the case table would be
  # served as application/octet-stream — which gzip_types then skips, sending
  # all 2.1 MB uncompressed. This mapping is what makes the compression below
  # actually apply.
  types {
    text/csv csv;
  }

  default_type application/octet-stream;
  access_log /dev/stdout;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  # Same reason as the pid file: the default temp paths live under /var/cache.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/csv
    application/json
    application/javascript
    application/xml
    image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed filenames under /assets, so these can never go
    # stale. Set Cache-Control directly rather than via `expires`, which would
    # emit a second, conflicting Cache-Control header alongside this one.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Not content-hashed, so it must revalidate rather than be pinned for a year.
    location = /cases.csv {
      add_header Cache-Control "public, max-age=3600";
    }

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    # SPA fallback. Must stay last so the more specific locations win.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
