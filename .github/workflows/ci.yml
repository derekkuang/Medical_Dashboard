name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run tells you nothing useful. Cancel in-flight runs for the same
# ref rather than paying for them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ordered cheapest-first so the fastest signal fails first. Formatting
      # errors should not wait behind a type-aware lint pass.
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  smoke:
    name: Browser smoke test
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Against the production build rather than the dev server: the artefact
      # that ships is the one worth testing, and Vite's dev pipeline is not it.
      - name: Build
        run: npm run build

      - name: Serve the build
        run: npm run preview -- --port 4173 --strictPort &

      - name: Wait for the server
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4173/ >/dev/null && exit 0
            sleep 1
          done
          echo "preview server never came up" >&2
          exit 1

      # Blocking. Needs nothing but the app and its own data file, and it is
      # what would have caught the bug where every chart rendered blank while
      # the whole unit suite passed.
      - name: Charts render
        run: npm run smoke:render
        env:
          SMOKE_URL: http://localhost:4173/
          CHROME_PATH: google-chrome

      # Advisory. This one calls the live VitalDB API, so a failure here may be
      # an upstream outage rather than a defect in this repository — which is
      # not something a build should be gated on. It still reports loudly.
      - name: Telemetry replays (advisory)
        continue-on-error: true
        run: npm run smoke
        env:
          SMOKE_URL: http://localhost:4173/
          CHROME_PATH: google-chrome

  image:
    name: Container image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Built on pull requests too — a change that breaks the Dockerfile should
      # fail the PR, not main. Only the push to the registry is gated on main.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
